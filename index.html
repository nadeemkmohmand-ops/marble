<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Marble factory management — blocks, slabs, cutting, sales, payroll" />
    <title>Marble Manager | ماربل منیجر</title>
    <script>
      // Boot before paint: restore language, direction and theme (prevents FOUC / wrong RTL flash)
      ;(function () {
        try {
          var lang = localStorage.getItem('marble.lang') || 'ur'
          var theme = localStorage.getItem('marble.theme') || 'system'
          var root = document.documentElement
          root.lang = lang
          root.dir = lang === 'ur' ? 'rtl' : 'ltr'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
